<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" role="img" aria-labelledby="title desc"><title id="title">Qwen-Image-2.1 模型与推理数据流</title><desc id="desc">文本与参考图由Qwen3-VL编码；参考图还经VAE编码。条件前缀与目标噪声进入32层单流DiT，Euler调度重复更新目标latent，最后VAE解码为RGBA图像。条件前缀KV只在首步计算并在后续去噪步复用。</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#8a9a78"/></marker></defs><rect width="1280" height="800" rx="12" fill="#f0f3e9"/><style>text{font-family:system-ui,"Microsoft YaHei",sans-serif;fill:#344332}.title{font-size:27px;font-weight:600}.head{font-size:21px;font-weight:600}.small{font-size:15px;fill:#6d7b62}.eyebrow{font-size:12px;letter-spacing:2px;fill:#81916f}.arrow{fill:none;stroke:#8a9a78;stroke-width:2;marker-end:url(#arrow)}</style><text x="36" y="48" class="eyebrow">QWEN-IMAGE-2.1 / ARCHITECTURE &amp; INFERENCE</text><text x="36" y="90" class="title">统一理解条件，循环生成目标图像。</text><rect x="36" y="130" width="250" height="90" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="56" y="165" class="head">文本指令</text><text x="56" y="195" class="small">Prompt / 编辑要求</text><rect x="36" y="275" width="250" height="115" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="56" y="310" class="head">参考图（可选）</text><text x="56" y="340" class="small">最多 10 张；顺序有意义</text><text x="56" y="364" class="small">RGB / RGBA 条件</text><rect x="350" y="130" width="340" height="115" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="370" y="165" class="head">Qwen3-VL 8B</text><text x="370" y="195" class="small">联合编码文本与图像语义</text><text x="370" y="219" class="small">这不是可省略的 7B 内部组件</text><rect x="350" y="290" width="340" height="100" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="370" y="325" class="head">RGBA VAE 编码</text><text x="370" y="355" class="small">参考图 → 条件 latent</text><rect x="760" y="160" width="475" height="190" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="780" y="195" class="head">条件前缀</text><text x="780" y="225" class="small">交错文本与条件图像 token</text><text x="780" y="249" class="small">首步进入 DiT 计算各层 K/V</text><text x="780" y="273" class="small">causal_condition=true 时跨步复用</text><text x="780" y="297" class="small">不是缓存所有 target latent</text><rect x="36" y="465" width="250" height="110" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="56" y="500" class="head">目标 latent xₜ</text><text x="56" y="530" class="small">随机噪声初始化</text><text x="56" y="554" class="small">只有目标部分随时间变化</text><rect x="350" y="450" width="470" height="155" rx="8" fill="#e2e9d5" stroke="#d1dac4"/><text x="370" y="485" class="head">单流 DiT · 32 层 / 7B</text><text x="370" y="515" class="small">块因果注意力 + 共享调制</text><text x="370" y="539" class="small">文本 token 因果；图像块内双向</text><text x="370" y="563" class="small">读取固定条件 KV，预测流场</text><rect x="900" y="450" width="335" height="155" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="920" y="485" class="head">Flow Matching / Euler</text><text x="920" y="515" class="small">按 sigma / timestep 更新 xₜ</text><text x="920" y="539" class="small">重复 N 次（依模型采样配方）</text><text x="920" y="563" class="small">不能把少步配方任意互换</text><rect x="900" y="680" width="335" height="90" rx="8" fill="#fcfcf8" stroke="#d1dac4"/><text x="920" y="715" class="head">VAE 解码 → RGB / RGBA</text><text x="920" y="745" class="small">最后解码；保留真实 alpha</text><path class="arrow" d="M286 175 H350"/><path class="arrow" d="M286 305 L320 305 V225 H350"/><path class="arrow" d="M286 350 H350"/><path class="arrow" d="M690 190 H760"/><path class="arrow" d="M690 340 H760"/><path class="arrow" d="M1000 350 V400 H585 V450"/><path class="arrow" d="M286 520 H350"/><path class="arrow" d="M820 520 H900"/><path class="arrow" d="M1060 605 V680"/><path class="arrow" d="M940 605 V640 H160 V575"/><text x="345" y="665" class="small">循环：更新目标 latent，再计算下一步；条件前缀保持不变。</text><text x="36" y="749" class="small">说明：示意数据流，不代表精确显存布局。7B 是视觉生成组件，非整条流水线参数量。</text></svg>